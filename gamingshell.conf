#=============================================================================

#==============================================================================
#THIS IS THE CONFIG OF BENI'S GAMING SHELL
#YOU CAN CHANGE THE DISPLAY RESOLUTION, REFRESH RATE, KEYBINDS, KEYBOARD AND MISC HERE IN THE CONFIG
#AT /HOME/USRNAME/.LOCAL/BIN/GAME-MODE.SH, YOU WILL FIND THE GAMING SCRIPT
#CHANGE THE SCRIPT TO YOUR LIKING, YOU CAN ADD ANOTHER LAUNCHER LIKE HEROIC GAMES LAUNCHER OR LUTRIS
#TO ACTIVATE GAMING MODE PRESS WIN + G
#==============================================================================
#=============================================================================

#=============================================================================
#DISPLAY
#Change to yout native reolution: 
#eDP-1=Monitor name
#1920x1080@60=resolution and refresh rate(@60), change to yours
#0x0=offset, usually you wont need this
#1=scaling, increase or decrese depending on your monitor
#=============================================================================
monitor = eDP-1, 1920x1080@60, 0x0, 1

#=============================================================================
#KEYBINDS
$mainMod=SUPER
#=============================================================================
bindm = SUPER, mouse:272, movewindow				#Win+Left Mouse Button to move activewindow
bindm = SUPER, mouse:273, resizewindow				#Win+Right Mouse Button to resize active window
bind = SUPER, right, workspace, r+1				#Win+shift+right to move active window to the right
bind = SUPER, left, workspace, r-1				#Win+Shift+right to move active window to the right
bind = SUPER SHIFT, right, movetoworkspace, r+1			#Win+right to switch a workspace to the right
bind = SUPER SHIFT, left, movetoworkspace, r-1			#Win+left to switch a workspace to the left
bind=$mainMod, E, exec, nautilus				#Win+E launches nautilus(change to your data manager)
bind=$mainMod, T, exec, kitty					#Win+T to launch kitty(change to yout terminal)
bind=$mainMod, Q, killactive					#Win+Q to kill the active window
bindr = SUPER, SUPER_L, exec, rofi -show drun -location 1	#Win to show application menu
bind=$mainMod, S, exec, ~/.local/bin/steam-gamemode.sh		#Win+S to start the Steam gamemode, launches Steam, stops waybar, freezes non-essential processes
bind=$mainMod, H, exec, ~/.local/bin/heroic-gamemode.sh

#=============================================================================
#DIRECT SCANOUT
#Increases performance in Gaming by ignoring the hyprland compositor, you probably want this
#=============================================================================
render {
direct_scanout=true
}
#
#=============================================================================
#INPUT
#=============================================================================
input{
    kb_layout = de #Keyboard layout, change this to yours
    kb_variant = 
    kb_model = 
    kb_options = 
    kb_rules =
    follow_mouse = 1
    touchpad{
        natural_scroll = true
    }
}
exec-once = waybar
# ==============================================================================
# LOOK & FEEL (Passend zu Waybar & Rofi)
# ==============================================================================

general {
    gaps_in = 6                  
    gaps_out = 10                
    border_size = 2
   
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(1a1b26aa)

    layout = dwindle            
}
#
decoration {
    rounding = 14               

    active_opacity = 1
    inactive_opacity = 0.5

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000055)
    }
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true
    bezier = md3_decel, 0.05, 0.7, 0.1, 1.0
    animation = windows, 1, 4, md3_decel, popin 70%
    animation = windowsOut, 1, 3, md3_decel, popin 80%
    animation = windowsMove, 1, 4, md3_decel, slide
    animation = workspaces, 1, 4, md3_decel, slide
}

#=============================================================================
#Autostart
#=============================================================================
exec-once = blueman-applet
